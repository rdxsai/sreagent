# Minimal single-binary Tempo: OTLP receiver in the distributor, local block
# storage, query API on 3200. Enough to ingest spans and search them by window.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 5s      # cut idle traces to the head block fast, so search sees them
  max_block_duration: 1m     # flush blocks quickly instead of every 5m

storage:
  trace:
    backend: local
    blocklist_poll: 30s      # querier picks up new blocks within 30s, not 5m
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
