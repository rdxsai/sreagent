# Sock Shop telemetry -> New Relic, in the exact shapes sentinel/newrelic/nrql.py queries.
#
# metrics: docker_stats reads the Docker API (app-agnostic) and emits
#   container.cpu.utilization + container.memory.usage.total keyed by container.name.
#   -> NR Metric events, queried by `WHERE container.name = <service>`.
# traces:  zipkin receiver ingests whatever native Zipkin spans the Sock Shop
#   services emit (front-end etc. via the ZIPKIN env); otlp receiver catches any
#   OTLP (e.g. a Beyla sidecar if added). Both -> NR Span events with
#   service.name, duration.ms, otel.status_code.
receivers:
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 10s
    container_labels_to_metric_labels:
      { }
    metrics:
      container.cpu.utilization:
        enabled: true
      container.memory.usage.total:
        enabled: true
      container.memory.percent:
        enabled: true
  zipkin:
    endpoint: 0.0.0.0:9411
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: { timeout: 5s }
  # NR ingests OTLP gauges fine; docker_stats emits gauges, so no delta conversion needed.

exporters:
  otlphttp/newrelic:
    endpoint: https://otlp.nr-data.net
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}
  debug:
    verbosity: normal

service:
  telemetry:
    logs: { level: warn }
  pipelines:
    metrics:
      receivers: [docker_stats]
      processors: [batch]
      exporters: [otlphttp/newrelic]
    traces:
      receivers: [zipkin, otlp]
      processors: [batch]
      exporters: [otlphttp/newrelic, debug]
