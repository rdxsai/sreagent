# Initial v1 scenario catalog for OpenTelemetry Demo recordings.
#
# This config is controller input and must not be passed to agent tools.
#
# Active set (locked 2026-06-07): payment_failure_001, payment_unreachable_001,
#   product_catalog_failure_001, cart_failure_001, ad_manual_gc_001, ad_high_cpu_001.
#   All six surface a clean signal against a clean baseline under self-driven load:
#   service errors for payment/product-catalog, an edge error for payment_unreachable,
#   cart and ad GC latency, and ad CPU saturation. Each fires the single unified
#   UserFacingDegradation trigger (error, latency, or CPU-cores rule). Each carries one
#   culprit (chg_0003) plus five decoys.
# Deferred: recommendation_cache_failure (gradual leak: the request volume needed to build
#   it overloads the path, so there is no clean baseline on this host),
#   load_generator_flood_homepage_001 (throughput surge), kafka_queue_problems_001 (async
#   consumer lag). The latter two attribute via rate/lag metrics rather than span.kind;
#   all three are added as a clean extension after the six. See handoff.md.

scenarios:
  - id: payment_failure_001
    display_name: Payment charge failure
    raw_flag_key: paymentFailure
    variant: "100%"
    timing:
      warmup_seconds: 120
      injection_at_seconds: 300
      recording_seconds: 600
    workload:
      profile: checkout_steady
      users: 20
      spawn_rate: 2
    public:
      symptom: Checkout payment attempts started failing during the recording window.
      sanitized_change:
        id: chg_0003
        time: 300
        service: payment
        kind: runtime_config_change
        summary: payment processing configuration changed
        diff_touches:
          - charge_handler
          - payment_provider
      decoy_changes:
        - id: chg_0001
          time: 270
          service: frontend
          kind: deploy
          summary: frontend copy and layout assets changed
          diff_touches:
            - copy
            - layout_assets
        - id: chg_0002
          time: 285
          service: recommendation
          kind: runtime_config_change
          summary: recommendation scoring parameter changed
          diff_touches:
            - scoring
        - id: chg_0004
          time: 350
          service: payment
          kind: runtime_config_change
          summary: payment retry budget adjusted
          diff_touches:
            - retry_budget
        - id: chg_0005
          time: 255
          service: currency
          kind: runtime_config_change
          summary: currency rate cache TTL changed
          diff_touches:
            - rate_cache
        - id: chg_0006
          time: 330
          service: shipping
          kind: runtime_config_change
          summary: shipping rate table updated
          diff_touches:
            - rate_table
    truth:
      root_cause:
        kind: service
        service: payment
        type: payment_charge_failure

