groups:
- name: sentinel_symptom_alerts
  rules:
  - alert: CheckoutFailureRate
    expr: (sum(rate(traces_span_metrics_calls_total{service_name="checkout",status_code="STATUS_CODE_ERROR"}[3m]))
      / sum(rate(traces_span_metrics_calls_total{service_name="checkout"}[3m]))) >
      0.1
    for: 60s
    labels:
      tier: user_facing
      signal: checkout_error_rate
      severity: critical
    annotations:
      summary: Checkout failure rate {{ $value }} since second onset
  - alert: FrontendHighErrorRate
    expr: (sum(rate(traces_span_metrics_calls_total{service_name="frontend",status_code="STATUS_CODE_ERROR"}[3m]))
      / sum(rate(traces_span_metrics_calls_total{service_name="frontend"}[3m]))) >
      0.05
    for: 60s
    labels:
      tier: user_facing
      signal: error_rate
      severity: critical
    annotations:
      summary: User-facing error rate {{ $value }} since second onset
  - alert: FrontendHighLatency
    expr: (histogram_quantile(0.95, sum(rate(traces_span_metrics_duration_milliseconds_bucket{service_name="frontend"}[3m]))
      by (le))) > 200.0
    for: 60s
    labels:
      tier: user_facing
      signal: latency_p95
      severity: warning
    annotations:
      summary: User-facing p95 latency {{ $value }}ms since second onset
  - alert: CheckoutHighLatency
    expr: (histogram_quantile(0.95, sum(rate(traces_span_metrics_duration_milliseconds_bucket{service_name="checkout"}[3m]))
      by (le))) > 250.0
    for: 60s
    labels:
      tier: user_facing
      signal: checkout_latency_p95
      severity: warning
    annotations:
      summary: Checkout p95 latency {{ $value }}ms since second onset
